<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1220">
<title>Checkout | DeckHub TCG</title>
<meta name="description" content="Finalize sua compra com pagamento via Pix.">
<meta property="og:title" content="Checkout | DeckHub TCG"><meta property="og:description" content="Finalize sua compra com pagamento via Pix."><meta property="og:image" content="images/logo.png"><meta property="og:locale" content="pt_BR">
<link rel="icon" href="images/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
<div id="site-header"></div>
<main id="app">
<div class="wrap">
  <h1 style="font-size:44px;margin-top:32px">Checkout</h1>
  <div class="lay">
    <div class="box">
      <div class="steps"><i class="on"></i><i></i></div>
      <form id="form"><div id="s1">
        <h3 class="f">Seus dados</h3><div class="fgr"><div class="full"><label for="nome">Nome completo</label><input class="in" id="nome" name="nome" type="text" required></div><div class=""><label for="email">E-mail</label><input class="in" id="email" name="email" type="email" required></div><div class=""><label for="tel">Telefone</label><input class="in" id="tel" name="tel" type="tel" required></div></div>
        <h3 class="f">Endereço de entrega</h3><div class="fgr"><div class=""><label for="cep">CEP</label><input class="in" id="cep" name="cep" type="text" required></div><div class=""><label for="end">Endereço</label><input class="in" id="end" name="end" type="text" required></div><div class=""><label for="num">Número</label><input class="in" id="num" name="num" type="text" required></div><div class=""><label for="comp">Complemento</label><input class="in" id="comp" name="comp" type="text" ></div><div class=""><label for="bairro">Bairro</label><input class="in" id="bairro" name="bairro" type="text" required></div><div class=""><label for="cidade">Cidade</label><input class="in" id="cidade" name="cidade" type="text" required></div><div class=""><label for="uf">Estado</label><input class="in" id="uf" name="uf" type="text" required></div></div>
        <h3 class="f">Entrega</h3><label class="opt"><input type="radio" checked> <span>Transportadora</span><b id="ship"></b></label>
        <button class="btn p w" style="margin-top:24px" type="submit">Continuar para o pagamento</button></div></form>
      <div id="s2" hidden><h3 class="f">Pagamento</h3>
        <div style="display:flex;gap:8px;margin:16px 0 24px"><span class="chip on">Pix</span><span class="chip" style="opacity:.5;cursor:not-allowed">Cartão (em breve)</span></div>
        <div class="pix" id="pix"></div><button class="lk" id="back" style="margin-top:24px">Voltar e editar dados</button></div>
    </div>
    <aside class="box" style="align-self:start"><b>Resumo do pedido</b><div id="sum" style="margin-top:12px"></div></aside>
  </div>
</div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/payment.js"></script>
<script src="js/app.js"></script>
<script src="js/viewer.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
